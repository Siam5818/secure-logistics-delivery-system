name: CI

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/SecureLogisticsDeliverySystem.slnx

      - name: Build
        run: dotnet build src/SecureLogisticsDeliverySystem.slnx --no-restore

      - name: Test
        run: dotnet test src/Services/OrderService/OrderService.Domain.Tests/OrderService.Domain.Tests.csproj --no-build
